# CI for bevy_stigmergy (canonical repository).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy + doc
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env: { RUSTDOCFLAGS: "-D warnings" }

  build:
    name: build (standalone) + test
    needs: lint
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # **The load-bearing step, and it is `build` rather than `test` deliberately.**
      #
      # `cargo test` compiles dev-dependencies, and this crate's dev-dependency is the FULL `bevy`
      # umbrella (the `foraging` example needs a window and a 2D camera). Cargo unifies features across
      # a build, so under `cargo test` the crate silently receives every Bevy feature there is — which
      # means a hole in its own `[dependencies]` feature list cannot fail. A sibling crate shipped
      # exactly that hole: it named a type behind a feature it never declared, every test passed, and
      # the published crate did not compile for anyone.
      - name: Build with only the declared features
        run: cargo build

      # The optional features are the other half of the same hole: `serde` and `reflect` name
      # `bevy_math/serialize` and `bevy_reflect`, which no default build ever touches.
      - name: Build with every feature
        run: cargo build --all-features

      # Includes `tests/leaf.rs`, the boundary ratchet — the thing that keeps this crate a field and
      # not a framework.
      - name: Test
        run: cargo test

      - name: Test with every feature
        run: cargo test --all-features

      - name: Build examples
        run: cargo build --examples
